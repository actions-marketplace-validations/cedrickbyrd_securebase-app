[build]
  base = "phase3a-portal"
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  VITE_ENABLE_MOCK_API = "false"
  VITE_USE_SUPABASE = "true"
  VITE_SUPABASE_URL = "https://dvmuaivsbtrykqsnrtnv.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bXVhaXZzYnRyeWtxc25ydG52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg4NTgwMDAsImV4cCI6MjA1NDQzNDAwMH0"

# MARKETING / PRICING REDIRECTS
[[redirects]]
  from = "/signup"
  to = "https://securebase.tximhotep.com/pricing"
  status = 301
  force = true

[[redirects]]
  from = "/register"
  to = "https://securebase.tximhotep.com/pricing"
  status = 301
  force = true

# SINGLE PAGE APPLICATION (SPA) FALLBACK
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# CSP & SECURITY HEADERS (SUPABASE AUTHORIZED)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: https: blob:;
      connect-src 'self' https://dvmuaivsbtrykqsnrtnv.supabase.co https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.stripe.com https://www.google-analytics.com https://analytics.google.com https://www.google.com;
      frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self' https://checkout.stripe.com;
    """
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-Environment = "demo"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/checkout"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://js.stripe.com https://*.stripe.com https://www.googletagmanager.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: https: blob:;
      connect-src 'self' https://dvmuaivsbtrykqsnrtnv.supabase.co https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.stripe.com https://www.google-analytics.com https://analytics.google.com https://www.google.com;
      frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com;
      frame-ancestors 'none';
      form-action 'self' https://checkout.stripe.com;
    """
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Environment = "demo"
    X-Robots-Tag = "noindex, nofollow"
