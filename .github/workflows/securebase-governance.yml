name: 'SecureBase IaC Governance'

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  compliance-scan:
    name: 'Shift-Left Compliance Audit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # v4.2.2 # v4.2.2

      - name: Run SecureBase Compliance Action
        run: python3 compliance_evidence_collector.py --mode shift-left
        with:
          working-directory: '.'
          fail-on-severity: 'HIGH'
          comment-on-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
