name: 'SecureBase IaC Governance'

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  compliance-scan:
    name: 'Shift-Left Compliance Audit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run SecureBase Compliance Action
        uses: securebase/shift-left-compliance-action@v1
        with:
          working-directory: '.'
          fail-on-severity: 'HIGH'
          comment-on-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}