name: 'SecureBase IaC Governance'

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  compliance-scan:
    name: 'Shift-Left Compliance Audit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run SecureBase Compliance Action
        uses: securebase/shift-left-compliance-action@9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b # v1.0.0
        with:
          working-directory: '.'
          fail-on-severity: 'HIGH'
          comment-on-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
