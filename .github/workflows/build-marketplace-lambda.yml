name: Build Marketplace Resolve Lambda
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.11'
      - name: Build Lambda zip with Linux dependencies
        run: |
          # Create a clean build directory
          rm -rf /tmp/build && mkdir -p /tmp/build
          
          # Copy source code and modules
          cp phase2-backend/functions/marketplace_resolve_customer.py /tmp/build/
          cp phase2-backend/lambda_layer/python/db_utils.py /tmp/build/
          
          # Install all required dependencies for AWS Lambda (Python 3.11/x86_64)
          # 'cryptography' is added to resolve your runtime import errors
          pip install PyJWT psycopg2-binary cryptography \
            --platform manylinux2014_x86_64 \
            --target /tmp/build \
            --python-version 3.11 \
            --only-binary=:all: \
            --upgrade \
            --quiet
          
          # Package the artifact
          cd /tmp/build && zip -r marketplace_resolve_customer.zip . -q
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
      - name: Upload and deploy
        run: |
          aws s3 cp /tmp/build/marketplace_resolve_customer.zip \
            s3://securebase-terraform-state-prod/lambda/marketplace_resolve_customer.zip
          aws lambda update-function-code \
            --function-name securebase-production-marketplace-resolve-customer \
            --s3-bucket securebase-terraform-state-prod \
            --s3-key lambda/marketplace_resolve_customer.zip \
            --region us-east-1
          aws lambda wait function-updated \
            --function-name securebase-production-marketplace-resolve-customer \
            --region us-east-1
          echo "✅ Lambda updated"
