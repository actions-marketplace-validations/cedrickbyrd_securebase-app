name: SecureBase MCP - CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'securebase/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # v4.2.2
      - uses: actions/setup-node@5e8422612396425301d03ad4d22843a80c11b884 # v4.0.2 # v4.2.0 # v4.2.0 # v4.2.0 # v4.2.0 # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npx tsc --noEmit

  unit-tests:
    name: Vitest Unit & Contract Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      NODE_ENV: test
      SECUREBASE_PLATFORM_OIDC_TOKEN: "ci-mock-jwt-token-00000000"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # v4.2.2
      - uses: actions/setup-node@5e8422612396425301d03ad4d22843a80c11b884 # v4.0.2 # v4.2.0 # v4.2.0 # v4.2.0 # v4.2.0 # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run --coverage
